data:
  image_resize_dims:
    height: 256
    width: 256
  data_dir: /root/vast/eric/luc3d-bench/lp3d_data
  video_dir: /root/vast/eric/luc3d-bench/lp3d_data/videos
  csv_file:
  - CollectedData_back.csv
  - CollectedData_backL.csv
  - CollectedData_mid.csv
  - CollectedData_midL.csv
  - CollectedData_top.csv
  - CollectedData_topL.csv
  view_names:
  - back
  - backL
  - mid
  - midL
  - top
  - topL
  camera_params_file: null
  num_keypoints: 15
  keypoint_names:
  - Nose
  - Ear_R
  - Ear_L
  - TTI
  - TailTip
  - Head
  - Trunk
  - Tail_0
  - Tail_1
  - Tail_2
  - Shoulder_left
  - Shoulder_right
  - Haunch_left
  - Haunch_right
  - Neck
  mirrored_column_matches: null
  columns_for_singleview_pca: null
training:
  imgaug: dlc
  imgaug_3d: true
  train_batch_size: 8
  val_batch_size: 16
  test_batch_size: 16
  train_prob: 0.9
  val_prob: 0.05
  train_frames: 1
  num_gpus: 1
  unfreezing_epoch: 3
  min_epochs: 50
  max_epochs: 50
  log_every_n_steps: 5
  check_val_every_n_epoch: 1
  ckpt_every_n_epochs: null
  num_workers: 0
  rng_seed_data_pt: 0
  rng_seed_model_pt: 0
  optimizer: AdamW
  optimizer_params:
    learning_rate: 5.0e-05
  lr_scheduler: multisteplr
  lr_scheduler_params:
    multisteplr:
      milestones:
      - 25
      - 35
      - 45
      gamma: 0.5
  uniform_heatmaps_for_nan_keypoints: true
  patch_mask:
    init_epoch: 10
    final_epoch: 50
    init_ratio: 0.0
    final_ratio: 0.3
model:
  losses_to_use: []
  backbone: vits_dino
  model_type: heatmap_multiview_transformer
  heatmap_loss_type: mse
  model_name: slap2m_mvt
  checkpoint: null
dali:
  base:
    train:
      sequence_length: 16
    predict:
      sequence_length: 32
  context:
    train:
      batch_size: 8
    predict:
      sequence_length: 32
losses:
  pca_multiview:
    log_weight: 5.0
    components_to_keep: 3
    epsilon: null
  pca_singleview:
    log_weight: 5.0
    components_to_keep: 0.99
    epsilon: null
  temporal:
    log_weight: 5.0
    epsilon: 20.0
    prob_threshold: 0.05
  supervised_reprojection_heatmap_mse:
    log_weight: 3.0
eval:
  predict_vids_after_training: false
  test_videos_directory: /root/vast/eric/luc3d-bench/lp3d_data/videos
  save_vids_after_training: false
  colormap: cool
  confidence_thresh_for_vid: 0.9
callbacks:
  anneal_weight:
    attr_name: total_unsupervised_importance
    init_val: 0.0
    increase_factor: 0.01
    final_val: 1.0
    freeze_until_epoch: 25
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
